

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="description" content="Log in to Locked-In — Student Internship &amp; Skill Tracker.">
  <title>Sign In | Locked-In — Student Internship &amp; Skill Tracker</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Locked-In">
  <meta name="application-name" content="Locked-In">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/theme-integrity.css">
</head>
<body>
  <main>
    <section id="login-page">
      <div class="auth-brand">
        <img src="/images/student-tracker-logo.jpg" alt="Locked-In logo">
        <div class="auth-brand-text">
          <span class="auth-brand-title">Locked-In</span>
          <span class="auth-brand-sub">Student Internship &amp; Skill Tracker</span>
        </div>
      </div>
      <h1>Locked-In</h1>
      <p>Student Internship &amp; Skill Tracker — Build your skills. Track your progress. Prepare for your career.</p>

      <h2>Welcome back</h2>
      <p>Log in to access your student dashboard.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" name="email"
                 autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password"
                 autocomplete="current-password" required>
        </div>

        <button type="submit" id="loginButton">Log In</button>
        <p id="loginMessage" role="status" aria-live="polite"></p>
      </form>

      <p>New here? <a href="/register.html">Create a student account</a></p>
      <footer class="auth-footer"><a href="/privacy-policy.html">Privacy Policy</a><span>·</span><a href="/terms.html">Terms of Service</a><span>·</span><a href="mailto:akshayaravind.rv@gmail.com">Contact</a></footer>
    </section>
  </main>

  <script src="/js/script.js"></script>
</body>
</html>
