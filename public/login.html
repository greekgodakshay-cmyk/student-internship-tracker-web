

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/theme-integrity.css">
</head>
<body>
  <main>
    <section id="login-page">
      <div class="auth-brand"><img src="/images/student-tracker-logo.jpg" alt="Student Internship &amp; Skill Tracker logo"><span>Student Internship<br>&amp; Skill Tracker</span></div>
      <h1>Student Tracker</h1>
      <p>Build your skills. Track your progress. Prepare for your career.</p>

      <h2>Welcome back</h2>
      <p>Log in to access your student dashboard.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" name="email"
                 autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password"
                 autocomplete="current-password" required>
        </div>

        <button type="submit" id="loginButton">Log In</button>
        <p id="loginMessage" role="status" aria-live="polite"></p>
      </form>

      <p>New here? <a href="/register.html">Create a student account</a></p>
      <footer class="auth-footer"><a href="/privacy-policy.html">Privacy Policy</a><span>·</span><a href="/terms.html">Terms of Service</a><span>·</span><a href="mailto:akshayaravind.rv@gmail.com">Contact</a></footer>
    </section>
  </main>

  <script src="/js/script.js"></script>
</body>
</html>
